# REVERT-WHEN-capk-probe-done: scratch only, never for a pull request.
#
# Phase A of the KubeVirt (CAPK) probe, with no NVKE: does a GitHub-hosted
# amd64 runner boot a Cluster API cluster of KubeVirt VMs? kind, KubeVirt with
# /dev/kvm, Cluster API with CAPK, then CAPK's own cluster template with its
# published Ubuntu 24.04 disk, one control-plane VM and one worker.
name: Scratch CAPK probe

on:
  push:
    branches:
      - scratch/capk-probe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scratch-capk-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBEVIRT_VERSION: v1.9.1
  CAPK_VERSION: v0.11.2
  NODE_VM_IMAGE: quay.io/capk/ubuntu-2404-container-disk:v1.34.1
  KUBERNETES_VERSION: v1.34.1
  CLUSTER_NAME: capk-probe

jobs:
  probe:
    name: capk probe (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -Eeuo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::this runner has no /dev/kvm"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          nproc
          free -g
          df -h /

      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1024
          sudo sysctl -w fs.inotify.max_user_watches=1048576

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work

      - name: Read pinned tool versions
        id: versions
        run: |
          {
            echo "kind_version=$(make --no-print-directory print-KIND_VERSION)"
            echo "kubectl_version=$(make --no-print-directory print-KUBECTL_VERSION)"
            echo "capi_version=$(make -s -C controller --no-print-directory print-CAPI_CORE_VERSION)"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up kind and kubectl
        uses: ./.github/actions/setup-kind
        with:
          kind_version: ${{ steps.versions.outputs.kind_version }}
          kubectl_version: ${{ steps.versions.outputs.kubectl_version }}

      - name: Create the management cluster
        run: |
          set -Eeuo pipefail
          # KubeVirt's bridge binding gives each guest its launcher pod's IP.
          # kind's kindnet routes point-to-point and bridge does not work on
          # it, so use Calico, as CAPK's quickstart does. Masquerade instead
          # gives every guest 10.0.2.2, which breaks a multi-node cluster.
          cat > "${RUNNER_TEMP}/kind.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: 10.244.0.0/16
          EOF
          kind create cluster --name capk-probe --config "${RUNNER_TEMP}/kind.yaml"
          curl -fsSL https://raw.githubusercontent.com/projectcalico/calico/v3.30.1/manifests/calico.yaml \
            | sed -e 's|# - name: CALICO_IPV4POOL_CIDR|- name: CALICO_IPV4POOL_CIDR|' \
                  -e 's|#   value: "192.168.0.0/16"|  value: "10.244.0.0/16"|' \
            | kubectl apply -f - > /dev/null
          kubectl wait --for=condition=Ready nodes --all --timeout=5m
          kubectl -n kube-system rollout status ds/calico-node --timeout=5m
          kubectl get nodes -o wide

      - name: Install KubeVirt
        run: |
          set -Eeuo pipefail
          base="https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}"
          kubectl apply -f "${base}/kubevirt-operator.yaml"
          kubectl apply -f "${base}/kubevirt-cr.yaml"
          start=$(date +%s)
          kubectl -n kubevirt wait kv kubevirt --for condition=Available --timeout=15m
          echo "KubeVirt Available after $(( $(date +%s) - start )) s"
          kubectl -n kubevirt get kv kubevirt -o jsonpath='{.status.conditions}' | jq .
          kubectl get nodes -o jsonpath='{.items[0].status.allocatable}' | jq .

      - name: Install Cluster API and CAPK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAPI_VERSION: ${{ steps.versions.outputs.capi_version }}
        run: |
          set -Eeuo pipefail
          make -C controller clusterctl-install
          controller/.local/bin/clusterctl init \
            --core "cluster-api:${CAPI_VERSION}" \
            --bootstrap "kubeadm:${CAPI_VERSION}" \
            --control-plane "kubeadm:${CAPI_VERSION}" \
            --infrastructure "kubevirt:${CAPK_VERSION}" \
            --wait-providers
          # --wait-providers can return before a provider's webhook serves.
          kubectl wait deployment -A -l cluster.x-k8s.io/provider --for=condition=Available --timeout=5m
          kubectl get deploy -A -l cluster.x-k8s.io/provider

      - name: Create the CAPK cluster
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          NODE_VM_IMAGE_TEMPLATE="${NODE_VM_IMAGE}" CRI_PATH=/var/run/containerd/containerd.sock \
            controller/.local/bin/clusterctl generate cluster "${CLUSTER_NAME}" \
            --infrastructure "kubevirt:${CAPK_VERSION}" \
            --kubernetes-version "${KUBERNETES_VERSION}" \
            --control-plane-machine-count 1 \
            --worker-machine-count 1 \
            --target-namespace default > "${RUNNER_TEMP}/capk-cluster.yaml"
          # kubeadm init finished in the VM, but CAPK's SSH check never found
          # its sentinel. NVKE's node agent reports bootstrap itself, so the
          # NVKE tenant would not use the check either.
          sed -i 's/checkStrategy: ssh/checkStrategy: none/' "${RUNNER_TEMP}/capk-cluster.yaml"
          grep -n checkStrategy "${RUNNER_TEMP}/capk-cluster.yaml"
          # CAPK's v1beta1 worker template has only `kubeletExtraArgs: {}` in
          # nodeRegistration. Converted to v1beta2 that is empty, which the
          # v1beta2 schema rejects (minProperties 1), so no worker is created.
          sed -i 's|^          kubeletExtraArgs: {}$|          criSocket: /var/run/containerd/containerd.sock|' "${RUNNER_TEMP}/capk-cluster.yaml"
          grep -n -A1 "nodeRegistration:" "${RUNNER_TEMP}/capk-cluster.yaml"
          for attempt in $(seq 1 12); do
            kubectl apply -f "${RUNNER_TEMP}/capk-cluster.yaml" && break
            (( attempt < 12 )) || exit 1
            echo "attempt ${attempt}: a webhook is not serving yet; retrying in 10 s"
            sleep 10
          done

      - name: Wait for the control-plane machine
        run: |
          set -Eeuo pipefail
          wait_machines() {
            local want="$1" minutes="$2" start deadline last="" phases state running
            start=$(date +%s)
            deadline=$((start + minutes * 60))
            while :; do
              phases="$(kubectl get machines -n default \
                -o jsonpath='{range .items[*]}{.metadata.name}={.status.phase}{"\n"}{end}' 2>/dev/null || true)"
              state="$(sort <<<"${phases}" | tr '\n' ' ')"
              if [[ "${state}" != "${last}" ]]; then
                echo "$(( $(date +%s) - start )) s: ${state}"
                last="${state}"
              fi
              running="$(grep -c '=Running$' <<<"${phases}" || true)"
              (( running >= want )) && return 0
              if (( $(date +%s) > deadline )); then
                echo "::error::${want} machines were not Running in ${minutes} minutes"
                return 1
              fi
              sleep 15
            done
          }
          declare -f wait_machines > "${RUNNER_TEMP}/wait-machines.sh"
          wait_machines 1 10

      # CAPK's quickstart installs a CNI next; until then the nodes are
      # NotReady. The API Service is a ClusterIP in the management cluster, so
      # reach it through a port-forward.
      - name: Install Calico on the workload cluster
        run: |
          set -Eeuo pipefail
          controller/.local/bin/clusterctl get kubeconfig "${CLUSTER_NAME}" -n default > "${RUNNER_TEMP}/workload.kubeconfig"
          chmod 0600 "${RUNNER_TEMP}/workload.kubeconfig"
          cat > "${RUNNER_TEMP}/workload-api.sh" <<'EOF'
          wk() { kubectl --kubeconfig "${RUNNER_TEMP}/workload.kubeconfig" --server https://127.0.0.1:16443 --insecure-skip-tls-verify "$@"; }
          # (Re)start the port-forward to the workload API until it answers.
          workload_api() {
            local i
            for i in $(seq 1 24); do
              wk get --raw /readyz > /dev/null 2>&1 && return 0
              pkill -f "port-forward svc/${CLUSTER_NAME}-lb" || true
              nohup kubectl -n default port-forward "svc/${CLUSTER_NAME}-lb" 16443:6443 >> "${RUNNER_TEMP}/port-forward.log" 2>&1 &
              sleep 5
            done
            echo "::error::the workload API did not answer through the port-forward"
            cat "${RUNNER_TEMP}/port-forward.log"
            return 1
          }
          EOF
          # shellcheck source=/dev/null
          . "${RUNNER_TEMP}/workload-api.sh"
          workload_api
          curl -fsSL https://raw.githubusercontent.com/projectcalico/calico/v3.30.1/manifests/calico.yaml \
            | sed -e 's|# - name: CALICO_IPV4POOL_CIDR|- name: CALICO_IPV4POOL_CIDR|' \
                  -e 's|#   value: "192.168.0.0/16"|  value: "10.243.0.0/16"|' > "${RUNNER_TEMP}/calico.yaml"
          grep -n -A1 'name: CALICO_IPV4POOL_CIDR' "${RUNNER_TEMP}/calico.yaml"
          wk apply -f "${RUNNER_TEMP}/calico.yaml" > /dev/null
          wk get nodes -o wide

      - name: Wait for both machines and nodes
        run: |
          set -Eeuo pipefail
          # shellcheck source=/dev/null
          . "${RUNNER_TEMP}/wait-machines.sh"
          wait_machines 2 15
          # shellcheck source=/dev/null
          . "${RUNNER_TEMP}/workload-api.sh"
          workload_api
          wk wait --for=condition=Ready nodes --all --timeout=10m
          wk get nodes -o wide

      - name: Diagnostics
        if: always()
        run: |
          set +e -uo pipefail
          kubectl get clusters,machines,kubevirtclusters,kubevirtmachines -A -o wide
          kubectl get vm,vmi -A -o wide
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -60
          kubectl -n capk-system logs deploy/capk-controller-manager --tail=200
          for vmi in $(kubectl get vmi -n default -o name); do
            echo "== ${vmi}"
            kubectl -n default get "${vmi}" -o jsonpath='{.status.phase} {.status.interfaces}{"\n"}'
          done
          kubectl get svc,endpointslices -n default -o wide
          # Can a pod reach each VM's SSH and API ports, and the API Service?
          targets="$(kubectl get vmi -n default -o jsonpath='{range .items[*]}{.status.interfaces[0].ipAddress}:22 {.status.interfaces[0].ipAddress}:6443 {end}')"
          targets+=" ${CLUSTER_NAME}-lb.default.svc:6443"
          kubectl run "port-probe-${RANDOM}" --rm -i --restart=Never --image=busybox:1.37 -- \
            sh -c "for t in ${targets}; do nc -zv -w 5 \${t%:*} \${t##*:} 2>&1; done"
          kubectl get kv -n kubevirt kubevirt -o jsonpath='{.spec.configuration.network}{"\n"}'
          kubectl get machinesets -n default -o yaml | sed -n '/^  status:/,$p' | head -60
          kubectl -n capi-system logs deploy/capi-controller-manager --tail=60 | grep -iE "machineset|preflight|skip|error" | tail -20
          kubectl get kubeadmcontrolplane -n default -o yaml | grep -A3 -E "type: (Initialized|Available|ControlPlaneComponentsHealthy)" | head -30
          kubectl -n capi-kubeadm-control-plane-system logs deploy/capi-kubeadm-control-plane-controller-manager --tail=40
          # The VM's serial console: cloud-init and kubeadm's output.
          for pod in $(kubectl get pods -n default -l kubevirt.io=virt-launcher -o name); do
            echo "== ${pod} guest console"
            kubectl -n default logs "${pod}" -c guest-console-log --tail=400 \
              | sed -E 's/(--token|--discovery-token-ca-cert-hash|--certificate-key) +[^ ]+/\1 <masked>/g'
          done
