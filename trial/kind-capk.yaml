# The management cluster for TRIAL_PROVIDER=capk. KubeVirt's bridge binding
# gives each VM its launcher pod's address, which does not work on kindnet's
# point-to-point routes, so the trial installs Calico instead. IPv4 only, and
# the Service range is fixed: the package server's address is in it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  ImageVolume: true
networking:
  ipFamily: ipv4
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
kubeadmConfigPatches:
- |
  kind: KubeletConfiguration
  serializeImagePulls: false
  maxParallelImagePulls: 4
nodes:
- role: control-plane
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
