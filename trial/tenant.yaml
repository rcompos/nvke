# The trial's tenant: a CreateClusterRequest for a CAPD (Docker-backed Cluster
# API) cluster with Calico, one control-plane node and one worker. Field names
# match the controller API; see /api/docs on the NVKE API.
#
# trial/nvke-trial.sh up creates it. By hand, with the trial's site up:
#   trial/nvke-trial.sh nvkectl create cluster -f trial/tenant.yaml
#
# controlPlaneKubernetesVersion must match the kindest/node tag the node image
# is built on (KINDEST_NODE_TAG in controller/hack/capd-kindest-node/Dockerfile),
# as must the releases' machine-init-kubernetes-version.

name: trial-1
controlPlaneKubernetesVersion: 1.34.8
cniPlugin: calico
etcdEncrypted: false

controlPlaneConfig:
  desiredCount: 1
  systemReservedMemory: "1Gi"
  infra:
    preKubeadmCommands:
      - "mkdir -p /run/cluster-api"
      - "echo success > /run/cluster-api/bootstrap-success.complete"
    machineTemplate:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DockerMachineTemplate
      spec:
        template:
          spec:
            customImage: cwe-capd-kindest-node:local
            extraMounts:
              - containerPath: /var/run/docker.sock
                hostPath: /var/run/docker.sock

nodePools:
  - name: worker
    nodeNamePrefix: w
    desiredNodeCount: 1
    controlPlane: false
    systemReservedMemory: "1Gi"
    nodeLabels:
      tier: compute
    autoProvisionDisabled: false
    autoModeDisabled: false
    recycleBudget: 0
    infra:
      preKubeadmCommands:
        - "mkdir -p /run/cluster-api"
        - "echo success > /run/cluster-api/bootstrap-success.complete"
      machineTemplate:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DockerMachineTemplate
        spec:
          template:
            spec:
              customImage: cwe-capd-kindest-node:local
              extraMounts:
                - containerPath: /var/run/docker.sock
                  hostPath: /var/run/docker.sock

infra:
  cluster:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: DockerCluster
    metadata:
      name: trial-1
    spec: {}
