            elif grep -q '^ *\[plugins\."io\.containerd\.grpc\.v1\.cri"\] *$' "${cfg}"; then
              sed -i '/^ *\[plugins\."io\.containerd\.grpc\.v1\.cri"\] *$/a\  enable_unprivileged_ports = true' "${cfg}"
            else
