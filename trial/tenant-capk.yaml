# The trial's tenant for TRIAL_PROVIDER=capk: KubeVirt VMs (CAPK) booting
# CAPK's stock Ubuntu 24.04 disk, which carries kubeadm, kubelet and containerd
# 1.34.1. At boot each VM fetches nvke-agent, spire-agent and the Calico package
# from the trial's package server (trial/capk-packages.yaml) and installs them;
# the controller's cloud-init then starts the agent, and the controller drives
# kubeadm through it as on any other node.
#
# controlPlaneKubernetesVersion matches the disk's kubelet; the trial rewrites
# its releases' machine-init-kubernetes-version to the same.

name: trial-1
controlPlaneKubernetesVersion: 1.34.1
cniPlugin: calico
etcdEncrypted: false

controlPlaneConfig:
  desiredCount: 1
  # Off container nodes the kubelet also reserves 2Gi and one CPU for
  # Kubernetes components, which the control plane cannot lower; the VM is
  # sized so something is left.
  systemReservedMemory: "512Mi"
  infra:
    bootstrapFiles:
      - path: /usr/local/sbin/nvke-trial-install
        owner: root:root
        permissions: "0755"
        content: |
          #!/bin/bash
          # Install the node bundles from the trial's package server.
          set -euxo pipefail
          packages=http://10.128.100.100:8080
          work="$(mktemp -d)"
          cd "${work}"
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors -o files.txt "${packages}/files.txt"
          while read -r f; do
            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors -o "${f}" "${packages}/${f}"
          done < files.txt
          . ./versions.env
          tar -xzf agent.tgz
          (cd "agent_${NODE_AGENT_VERSION}_${NODE_AGENT_DIR_ARCH}" && ./agent-installer.sh) || true
          test -x /usr/local/bin/nvke-agent
          test -f /etc/systemd/system/nvke-agent.service
          mkdir -p spire
          tar -xzf spire-agent.tgz --strip-components=1 -C spire
          (cd spire && ./install.sh)
          # As on the CAPD node image: the agent reads the workload socket as root.
          mkdir -p /etc/systemd/system/spire-agent.service.d
          printf '[Service]\nUser=root\nGroup=root\nSupplementaryGroups=\n' \
            > /etc/systemd/system/spire-agent.service.d/override.conf
          # OVN-Kubernetes needs Open vSwitch and its kernel module on the node.
          if [ -f cni-charts.deb ]; then
            if ! modprobe openvswitch; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y "linux-modules-extra-$(uname -r)"
              modprobe openvswitch
            fi
            if ! command -v ovs-vsctl >/dev/null; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y openvswitch-switch
            fi
            systemctl enable --now openvswitch-switch
          fi
          # This disk ships containerd as a binary, not as the packages the CNI
          # debs depend on.
          # The OVN images package imports with ctr, by default /usr/local/bin/ctr.
          NKE_CTR_BIN="$(command -v ctr)"
          export NKE_CTR_BIN
          for deb in *.deb; do
            if [ -f "${deb}" ]; then dpkg --ignore-depends=containerd,nvke-kubeadm-distro -i "${deb}"; fi
          done
          # The tenant VMs sit in the management cluster's pod network, whose
          # Calico drops packets a VM sends from any address but its own, so
          # tenant pod traffic must always be encapsulated.
          calico_cr=/usr/share/nvke-cni/calico/manifests/custom-resources.yaml
          if [ -f "${calico_cr}" ]; then
            sed -i 's/encapsulation: VXLANCrossSubnet/encapsulation: VXLAN/' "${calico_cr}"
            grep -q 'encapsulation: VXLAN$' "${calico_cr}"
          fi
          # containerd 1.7 on this disk withholds NET_BIND_SERVICE from non-root
          # containers, and node-local-dns binds port 53 as non-root. containerd
          # 2.x allows unprivileged ports by default.
          cfg=/etc/containerd/config.toml
          if [ ! -s "${cfg}" ]; then mkdir -p /etc/containerd; containerd config default > "${cfg}"; fi
          if grep -q 'enable_unprivileged_ports' "${cfg}"; then
            sed -i 's/enable_unprivileged_ports = false/enable_unprivileged_ports = true/' "${cfg}"
          elif grep -q '^ *\[plugins\."io\.containerd\.grpc\.v1\.cri"\] *$' "${cfg}"; then
            sed -i '/^ *\[plugins\."io\.containerd\.grpc\.v1\.cri"\] *$/a\  enable_unprivileged_ports = true' "${cfg}"
          else
            printf '\n[plugins."io.containerd.grpc.v1.cri"]\n  enable_unprivileged_ports = true\n' >> "${cfg}"
          fi
          grep -q 'enable_unprivileged_ports = true' "${cfg}"
          systemctl restart containerd
          # Copy the node's logs to the serial console, which the trial's
          # diagnostics read through the launcher pod.
          printf '%s\n' '[Unit]' 'Description=Copy node logs to the serial console' '' '[Service]' \
            "ExecStart=/bin/sh -c 'journalctl -f -o short -u kubelet -u nvke-agent -u spire-agent -u containerd -u ovs-vswitchd -u ovsdb-server > /dev/ttyS0'" \
            'Restart=always' '' '[Install]' 'WantedBy=multi-user.target' \
            > /etc/systemd/system/nvke-trial-console.service
          systemctl daemon-reload
          systemctl enable --now nvke-trial-console.service
          systemctl enable nvke-agent.service spire-agent.service
          systemctl restart spire-agent.service
          cd /
          rm -rf "${work}"
    preKubeadmCommands:
      - "/usr/local/sbin/nvke-trial-install 2>&1 | tee /var/log/nvke-trial-install.log > /dev/ttyS0"
    machineTemplate:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: KubevirtMachineTemplate
      spec:
        template:
          spec:
            # The node agent reports bootstrap to the controller; CAPK's SSH
            # check for its sentinel file is not used.
            virtualMachineBootstrapCheck:
              checkStrategy: none
            virtualMachineTemplate:
              spec:
                runStrategy: Always
                template:
                  spec:
                    domain:
                      cpu:
                        cores: 2
                      memory:
                        guest: "5Gi"
                      devices:
                        networkInterfaceMultiqueue: true
                        disks:
                          - disk:
                              bus: virtio
                            name: containervolume
                    evictionStrategy: External
                    volumes:
                      - containerDisk:
                          image: quay.io/capk/ubuntu-2404-container-disk:v1.34.1
                        name: containervolume

nodePools:
  - name: worker
    nodeNamePrefix: w
    desiredNodeCount: 1
    controlPlane: false
    systemReservedMemory: "512Mi"
    kubeReservedMemory: "512Mi"
    nodeLabels:
      tier: compute
    autoProvisionDisabled: false
    autoModeDisabled: false
    recycleBudget: 0
    infra:
      bootstrapFiles:
        - path: /usr/local/sbin/nvke-trial-install
          owner: root:root
          permissions: "0755"
          content: |
